<html lang="vi">
<head>

<title>Hướng dẫn sử dụng App Membership Golden Lotus</title>
<style>
:root{--gold:#c48b19;--gold-soft:#e6c47a;--stage:#1a1208;--ink:#f5ecd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--stage:#120c05}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px 76px 64px}
.slide{position:relative;aspect-ratio:16/9;width:min(100%, calc((100vh - 76px) * 16 / 9));max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.45);border-radius:6px;overflow:hidden;background:#fff}
.slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border-radius:8%/9%;cursor:pointer;border:0;background:transparent;padding:0;transition:box-shadow .15s,background .15s}
.hot:hover,.hot:focus-visible{background:rgba(196,139,25,.08);box-shadow:inset 0 0 0 3px var(--gold);outline:none}
.zone{position:absolute;border:0;padding:0;background:transparent;cursor:zoom-in;border-radius:4px;transition:box-shadow .15s}
.zone:hover,.zone:focus-visible{box-shadow:0 0 0 3px var(--gold);outline:none}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(230,196,122,.55);background:rgba(43,30,11,.85);color:var(--gold-soft);display:grid;place-items:center;cursor:pointer;transition:background .15s,opacity .15s}
.nav:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.nav:focus-visible,.home:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
.nav[disabled]{opacity:.25;pointer-events:none}
.prev{left:14px}.next{right:14px}
.bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px}
.home{height:42px;padding:0 16px 0 12px;border-radius:21px;border:1.5px solid rgba(230,196,122,.55);background:rgba(43,30,11,.85);color:var(--gold-soft);display:flex;align-items:center;gap:8px;font:600 14px Arial,sans-serif;cursor:pointer}
.home:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.home[hidden]{display:none}
.count{font-size:14px;color:rgba(245,236,217,.75);min-width:190px;text-align:center}
.count b{color:var(--gold-soft);font-weight:600}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lb{position:fixed;inset:0;background:rgba(12,8,3,.88);display:none;touch-action:none;overflow:hidden;z-index:10}
.lb.open{display:block}
.lb img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab;border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.6);background:#fff}
.lb img.drag{cursor:grabbing}
.lbtools{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px}
.tb{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(230,196,122,.55);background:rgba(43,30,11,.9);color:var(--gold-soft);display:grid;place-items:center;cursor:pointer}
.tb:hover{background:var(--gold);color:#fff}
.tb:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
.lbhint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;color:#f5ecd9;background:rgba(43,30,11,.9);padding:8px 14px;border-radius:18px;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.stage{padding:8px 8px 64px}.nav{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:none;width:44px;height:44px}.prev{left:10px}.next{right:10px}.count{min-width:0;font-size:12px}.count span{display:none}}
@media (prefers-reduced-motion:no-preference){.slide img{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
.gate{position:fixed;inset:0;z-index:50;background:var(--stage);display:flex;align-items:center;justify-content:center;padding:20px}
.gate[hidden]{display:none}
.gbox{width:100%;max-width:360px;background:#2b1e0b;border:1.5px solid rgba(230,196,122,.45);border-radius:16px;padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center}
.gbox h1{margin:12px 0 4px;font-size:20px;color:var(--gold-soft)}
.gbox p{margin:0 0 18px;font-size:14px;color:rgba(245,236,217,.75)}
.gbox label{display:block;text-align:left;font-size:13px;color:rgba(245,236,217,.8);margin:10px 0 6px}
.gbox input{width:100%;height:46px;border-radius:10px;border:1.5px solid rgba(230,196,122,.4);background:#1a1208;color:var(--ink);font-size:16px;padding:0 14px}
.gbox input:focus{outline:none;border-color:var(--gold)}
.gbox button{margin-top:18px;width:100%;height:48px;border:0;border-radius:24px;background:var(--gold);color:#fff;font:700 16px Arial,sans-serif;cursor:pointer}
.gerr{min-height:20px;margin-top:10px;font-size:14px;color:#f0a58a}
</style>
</head>

function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function patchLogin(){
 const base=await loadImg(IMGS[3]),nu=await loadImg('login3.webp');
 const W=base.naturalWidth,H=base.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');g.drawImage(base,0,0);
 const z=ZONES['3'][2];const zx=z[0]/100*W,zy=z[1]/100*H,zw=z[2]/100*W,zh=z[3]/100*H;
 g.fillStyle='#f6f1e7';g.fillRect(zx-.004*W,zy-.004*H,zw+.008*W,zh+.012*H);
 const h=zh,w=h*nu.naturalWidth/nu.naturalHeight,x=zx+zw/2-w/2,y=zy;
 g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x+1,y+3,w,h);
 g.drawImage(nu,x,y,w,h);g.strokeStyle='#ded6c6';g.lineWidth=Math.max(1,W/1920);g.strokeRect(x,y,w,h);

 IMGS[6]=c.toDataURL('image/jpeg',.9);ZONES['6']=NZ;

async function load(){
 const c=document.getElementById('count');c.textContent='Đang tải…';
 try{
  const t=await (await fetch('deck.html')).text();
  const re=/data:image\\?\/(jpeg|jpg|png|webp);base64,([A-Za-z0-9+\/\\=]+)/g;
  const found=[],seen=new Set();let m;
  while((m=re.exec(t))){const b=m[2].replace(/\\/g,'');if(b.length<20000||seen.has(b))continue;seen.add(b);found.push({type:m[1],b})}
  const bytes=f=>{const p=(f.b.endsWith('==')?2:f.b.endsWith('=')?1:0);return f.b.length*3/4-p};
  const out=new Array(SIZES.length).fill(null);const rest=[];
  found.forEach(f=>{const i=SIZES.indexOf(bytes(f));if(i>=0&&!out[i])out[i]=f;else rest.push(f)});
  for(let i=0;i<SIZES.length;i++){if(!out[i])out[i]=rest.shift()||null}
  IMGS=out.slice(0,BASE).map(f=>f?('data:image/'+(f.type==='jpg'?'jpeg':f.type)+';base64,'+f.b):'');
  IMGS[TOC]='toc_e.webp';IMGS[7]='dat_lich_p8.webp';IMGS[11]='slide12_new.webp';CMS_FILES.forEach(f=>IMGS.push(f));
  try{await patchLogin()}catch(e){}
  try{await patchZone(10,1,'p25.webp');await patchZone(10,2,'img2.webp')}catch(e){}
  try{await patchWheel()}catch(e){}
  try{await patchFit(9,1,'voucher_list.webp',[1050,425,780,908])}catch(e){}
  try{await patchFit(9,2,'voucher_qr.webp',[1957,425,780,908])}catch(e){}
  insertDownload();
  go(parseHash(),false);
 }catch(e){c.innerHTML='Không tải được nội dung. <a style="color:#e6c47a" href="deck.html">Mở bản dự phòng</a>'}
}
