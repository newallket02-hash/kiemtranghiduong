<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1620" viewBox="0 0 2880 1620" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><filter id="s" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".18"/></filter></defs><rect width="2880" height="1620" fill="#ffffff"/><text x="129.6" y="155.1" font-size="78.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">4. VÒNG QUAY MAY MẮN</text><text x="129.6" y="251.0" font-size="42.0" font-weight="normal" fill="#6E665A" text-anchor="start">Mỗi ngày có 1 lượt quay để nhận điểm thưởng. Mở vòng quay từ Trang chủ, hoặc từ cửa sổ tự hiện khi mở App.</text><text x="129.6" y="1548.1" font-size="27.0" font-weight="normal" fill="#6E665A" text-anchor="start">Hướng dẫn sử dụng App Membership Golden Lotus</text><text x="2749.7" y="1548.1" font-size="27.0" font-weight="normal" fill="#6E665A" text-anchor="end">7</text><rect x="129.6" y="298.1" width="194.4" height="64.8" rx="32.4" fill="#2B1E0B"/><text x="226.8" y="341.5" font-size="31.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MỞ</text><text x="345.6" y="343.1" font-size="36.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Vào vòng quay</text><line x1="129.6" y1="371.5" x2="1159.8" y2="371.5" stroke="#C48B19" stroke-width="3.8"/><rect x="1189.5" y="298.1" width="194.4" height="64.8" rx="32.4" fill="#2B1E0B"/><text x="1286.7" y="341.5" font-size="31.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QUAY</text><text x="1405.5" y="343.1" font-size="36.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Quay &amp; nhận thưởng</text><line x1="1189.5" y1="371.5" x2="2219.7" y2="371.5" stroke="#C48B19" stroke-width="3.8"/><rect x="2249.4" y="298.1" width="194.4" height="64.8" rx="32.4" fill="#2B1E0B"/><text x="2346.6" y="341.5" font-size="31.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">XEM</text><text x="2465.4" y="343.1" font-size="36.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Lịch sử quay</text><line x1="2249.4" y1="371.5" x2="2749.7" y2="371.5" stroke="#C48B19" stroke-width="3.8"/><rect x="129.6" y="384.5" width="500.3" height="1121.0" rx="16.5" fill="#F6F1E7" filter="url(#s)"/><ellipse cx="183.6" cy="438.5" rx="32.4" ry="32.4" fill="#C48B19" filter="url(#s)"/><text x="183.6" y="449.0" font-size="30.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="231.1" y="437.0" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Chọn Vòng quay</text><text x="231.1" y="475.6" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">may mắn</text><text x="379.7" y="1311.1" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">Tại Trang chủ, chọn biểu</text><text x="379.7" y="1346.2" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">tượng “Vòng quay may</text><text x="379.7" y="1381.3" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">mắn”.</text><rect x="659.6" y="384.5" width="500.3" height="1121.0" rx="16.5" fill="#F6F1E7" filter="url(#s)"/><ellipse cx="713.6" cy="438.5" rx="32.4" ry="32.4" fill="#C48B19" filter="url(#s)"/><text x="713.6" y="449.0" font-size="30.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="761.1" y="437.0" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Tự hiện khi mở</text><text x="761.1" y="475.6" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">App</text><text x="909.7" y="1311.1" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">Nếu hôm nay chưa quay,</text><text x="909.7" y="1346.2" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">vòng quay tự hiện khi mở</text><text x="909.7" y="1381.3" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">App: chọn “Quay ngay”</text><text x="909.7" y="1416.4" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">hoặc “Để sau”. Đã quay rồi</text><text x="909.7" y="1451.5" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">thì không hiện lại.</text><rect x="1189.5" y="384.5" width="500.3" height="1121.0" rx="16.5" fill="#F6F1E7" filter="url(#s)"/><ellipse cx="1243.5" cy="438.5" rx="32.4" ry="32.4" fill="#C48B19" filter="url(#s)"/><text x="1243.5" y="449.0" font-size="30.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="1291.0" y="437.0" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Nhấn GO để quay</text><text x="1439.6" y="1311.1" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">Nhấn “GO” để quay. Bên</text><text x="1439.6" y="1346.2" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">dưới hiển thị lượt còn lại, số</text><text x="1439.6" y="1381.3" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">lần đã quay và số giải</text><text x="1439.6" y="1416.4" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">thưởng.</text><rect x="1719.5" y="384.5" width="500.3" height="1121.0" rx="16.5" fill="#F6F1E7" filter="url(#s)"/><ellipse cx="1773.5" cy="438.5" rx="32.4" ry="32.4" fill="#C48B19" filter="url(#s)"/><text x="1773.5" y="449.0" font-size="30.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="1821.0" y="437.0" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Nhận giải thưởng</text><text x="1969.6" y="1311.1" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">Màn hình hiện giải thưởng</text><text x="1969.6" y="1346.2" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">vừa nhận, ví dụ 10000</text><text x="1969.6" y="1381.3" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">điểm. Nhấn ✕ để đóng.</text><rect x="2249.4" y="384.5" width="500.3" height="1121.0" rx="16.5" fill="#F6F1E7" filter="url(#s)"/><ellipse cx="2303.4" cy="438.5" rx="32.4" ry="32.4" fill="#C48B19" filter="url(#s)"/><text x="2303.4" y="449.0" font-size="30.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="2350.9" y="437.0" font-size="33.0" font-weight="bold" fill="#2B1E0B" text-anchor="start">Xem lịch sử quay</text><text x="2499.6" y="1311.1" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">Kéo xuống cuối trang xem</text><text x="2499.6" y="1346.2" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">các lượt đã quay; nhấn biểu</text><text x="2499.6" y="1381.3" font-size="30.0" font-weight="normal" fill="#26221C" text-anchor="middle">tượng làm mới để cập nhật.</text></svg>